services:

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # Ollama direct access — keeps qwen3-coder:30b and nomic-embed-text in model selector
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      # Authentication
      WEBUI_AUTH: "True"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      # Do NOT set OPENAI_API_BASE_URL here — it overrides the model selector.
      # Register assistant-api manually via Admin Panel > Settings > Connections instead.
    volumes:
      - openwebui-data:/app/backend/data
    # depends_on:
      # ollama:
      #   condition: service_healthy
      # assistant-api:
      #   condition: service_healthy
    networks:
      - ai-assistant-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ai-assistant-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ai-assistant-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  assistant-api:
    build:
      context: .
      dockerfile: AssistantApi/Dockerfile
    container_name: assistant-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Ollama__BaseUrl: "http://ollama:11434"
      Qdrant__Host: "qdrant"
      Qdrant__Port: "6334"
      Jwt__Secret: ${JWT_SECRET}
      Ingestion__RepositoryCachePath: "/data/repository-cache"
      Ingestion__UploadPath: "/data/uploads"
    volumes:
      - repository-cache:/data/repository-cache
    depends_on:
      postgres:
        condition: service_healthy
      # ollama:
      #   condition: service_healthy
      # qdrant:
      #   condition: service_healthy
    networks:
      - ai-assistant-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ingestion-service:
    build:
      context: .
      dockerfile: IngestionService/Dockerfile
    container_name: ingestion-service
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Ollama__BaseUrl: "http://ollama:11434"
      Qdrant__Host: "qdrant"
      Qdrant__Port: "6334"
      Ingestion__RepositoryCachePath: "/data/repository-cache"
      Ingestion__UploadPath: "/data/uploads"
    volumes:
      - repository-cache:/data/repository-cache
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-assistant-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ai-assistant-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  ollama-models:
    external: true
  qdrant-data:
    external: true
  postgres-data:
    external: true
  openwebui-data:
    external: true
  repository-cache:
    external: true

networks:
  ai-assistant-net:
    external: true
